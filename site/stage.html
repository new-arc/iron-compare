<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Iron Compare · Stage demo</title>
  <meta name="description" content="Two irons side by side: the stage demo of Iron Compare.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1310">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101a16'/%3E%3Cpath d='M9 8v16M23 8v16' stroke='%23f4f2ec' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M14 16h4' stroke='%23e9b949' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="stage.css?v=20261114124827">
</head>
<body>
  <!-- One canvas for the whole page. It sits behind the text and is fitted to
       the layout every frame, so the clubs and the HTML move as one picture. -->
  <canvas id="gl" class="gl" aria-hidden="true"></canvas>
  <!-- Plain images that take over if the canvas cannot be used. -->
  <div id="flat" class="flat" aria-hidden="true"></div>
  <!-- Callout rings and leader lines, drawn over the clubs. -->
  <svg id="leaders" class="leaders" aria-hidden="true"></svg>

  <main id="stage" class="stage" data-phase="loading">
    <header class="bar">
      <div class="bar-start">
        <a class="brandmark" href="./" id="home">Iron <em>Compare</em></a>
        <a class="look-link" href="tape.html">Tape look</a>
      </div>
      <div class="rail" id="rail" role="group" aria-label="Club to compare">
        <span class="rail-label">Club</span>
      </div>
      <div class="bar-actions">
        <button type="button" class="pill" id="replay" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Replay</span><kbd>R</kbd>
        </button>
        <a class="pill pill-quiet" id="full" href="./">Full comparison</a>
      </div>
    </header>

    <section class="intro" id="intro">
      <h1 class="intro-title" id="intro-title">See exactly how two irons differ.</h1>
      <p class="intro-sub">Real specs. Real photos. Side by side.</p>
      <div class="cta-wrap">
        <button type="button" class="cta" id="start" disabled>
          <span class="cta-word">Compare</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p class="cta-hint">or press <kbd>Space</kbd></p>
      </div>
    </section>

    <section class="head" id="head" aria-live="polite">
      <p class="head-club" id="head-club"></p>
      <p class="head-sub" id="head-sub"></p>
    </section>

    <section class="module side-a" id="mod-a" aria-label="Club A">
      <div class="slot slot-intro" data-slot="intro"></div>
      <div class="slot slot-compare" data-slot="compare"></div>
      <div class="tags" data-tags></div>
      <div class="plate">
        <p class="plate-brand"><span class="dot"></span><span data-brand></span></p>
        <h2 class="plate-name" data-name></h2>
        <p class="plate-sub" data-sub></p>
      </div>
    </section>

    <section class="module side-b" id="mod-b" aria-label="Club B">
      <div class="slot slot-intro" data-slot="intro"></div>
      <div class="slot slot-compare" data-slot="compare"></div>
      <div class="tags" data-tags></div>
      <div class="plate">
        <p class="plate-brand"><span class="dot"></span><span data-brand></span></p>
        <h2 class="plate-name" data-name></h2>
        <p class="plate-sub" data-sub></p>
      </div>
    </section>

    <section class="beats" id="beats" aria-label="How the clubs differ"></section>

    <footer class="foot" id="foot">
      <ul class="also" id="also"></ul>
      <p class="notes" id="notes"></p>
    </footer>

    <p class="status" id="status" role="status">Loading the comparison…</p>
  </main>

  <noscript><p class="noscript">This page needs JavaScript. The full comparison is at <a href="./">Iron Compare</a>.</p></noscript>
  <script src="core.js?v=20261114124827" defer></script>
  <script src="stage.js?v=20261114124827" defer></script>
</body>
</html>
